<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 462 1016" width="462" height="1016" fill="none">
  <!--
    Reading Gate hero phone — a 3/4-tilted handset whose screen is filled with the
    hero background (#0e0e0d) so only the metallic frame reads as a silhouette on
    dark. Drawn as a vector so it stays crisp at any scale and clips cleanly into
    the nine shatter wedges. Ratio ≈ 462×1016 (the authored reference size).
  -->
  <defs>
    <!-- Metallic frame: bright rims on the long edges, dark in the middle → rounded steel. -->
    <linearGradient id="rgFrame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#43434c"/>
      <stop offset="0.10" stop-color="#15151a"/>
      <stop offset="0.50" stop-color="#1b1b20"/>
      <stop offset="0.90" stop-color="#101014"/>
      <stop offset="1"    stop-color="#4a4a54"/>
    </linearGradient>
    <!-- Screen fill = hero background, with the faintest top-down sheen. -->
    <linearGradient id="rgScreen" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0"   stop-color="#141416"/>
      <stop offset="0.6" stop-color="#0e0e0d"/>
      <stop offset="1"   stop-color="#090909"/>
    </linearGradient>
  </defs>

  <!-- Whole phone tilted ~8° for the editorial 3/4 stance. -->
  <g transform="rotate(-8 231 508)">
    <!-- Depth / thickness hint behind the frame (left-side receding edge). -->
    <rect x="79" y="126" width="290" height="776" rx="70" ry="70" fill="#050506"/>

    <!-- Metallic frame. -->
    <rect x="86" y="120" width="290" height="776" rx="68" ry="68"
          fill="url(#rgFrame)" stroke="#5a5a63" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- Screen (blends into the hero background). -->
    <rect x="98" y="132" width="266" height="752" rx="57" ry="57"
          fill="url(#rgScreen)" stroke="#000" stroke-opacity="0.5" stroke-width="1"/>

    <!-- Decorative dashed inner stitch line. -->
    <rect x="116" y="150" width="230" height="716" rx="46" ry="46"
          fill="none" stroke="#f4f4f2" stroke-opacity="0.12"
          stroke-width="1.5" stroke-dasharray="5 7"/>

    <!-- Dynamic Island. -->
    <rect x="192" y="156" width="78" height="26" rx="13" ry="13"
          fill="#050506" stroke="#26262b" stroke-opacity="0.6" stroke-width="1"/>
    <circle cx="252" cy="169" r="4" fill="#0d0d12"/>
  </g>
</svg>
