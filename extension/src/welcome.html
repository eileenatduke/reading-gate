<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Welcome to Reading Gate</title>
  <!-- Brand fonts: Source Sans 3 (body/UI) + Playfair Display (headings), same source
       as the dashboard so the type matches exactly. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="gate/tokens.css" />
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      background: var(--app-bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--sp-5);
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 26.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: var(--sp-6);
      box-sizing: border-box;
    }
    /* Body / UI text: Source Sans 3 (falls back to the system sans stack in --font-sans). */
    body { font-family: var(--font-sans); }
    .brand { font-weight:700; font-size: var(--fs-lg); margin-bottom: var(--sp-5); }
    /* Headings: Playfair Display (serif display), per the brand type guidelines. */
    h1 { font-family: var(--font-serif); font-weight: 600; font-size: var(--fs-2xl); line-height: 1.1; margin: 0 0 var(--sp-3); }
    .lead { color: var(--muted); font-size: var(--fs-lg); margin: 0 0 var(--sp-4); line-height: 1.55; }
    label { display:block; font-size: var(--fs-base); font-weight:600; margin-bottom: var(--sp-1); }
    input {
      width:100%; font:inherit; font-size: var(--fs-lg); padding: var(--sp-3); margin-bottom: var(--sp-4);
      border:1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); color: var(--text); box-sizing:border-box;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
    .btn {
      width:100%; font:inherit; font-size: var(--fs-base); font-weight:600; cursor:pointer;
      border:none; border-radius: var(--radius); padding: var(--sp-3);
      background: var(--accent); color:#fff;
    }
    .btn:disabled { opacity:.6; cursor:default; }
    .toggle-link { background:none; border:none; color:var(--accent); cursor:pointer; font:inherit; padding:0; text-decoration: underline; }
    .switch { text-align:center; margin-top: var(--sp-4); font-size: var(--fs-base); color: var(--muted); }
    .err { color: var(--danger); font-size: var(--fs-sm); margin-bottom: var(--sp-3); min-height: 1em; }
    /* Don't reserve empty vertical space above the email field when there's no error. */
    .err:empty { min-height: 0; margin-bottom: 0; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Reading Gate</div>

    <!-- Step 1: create an account -->
    <div id="create" class="hidden">
      <h1 id="create-title">Create your account</h1>
      <p class="lead" id="create-lead">
        Sign up with an email and password to get started.
      </p>
      <div class="err" id="create-err"></div>
      <input id="email" type="email" placeholder="Email address" aria-label="Email address" autocomplete="username" />
      <input id="password" type="password" placeholder="Password" aria-label="Password" autocomplete="new-password" />
      <button class="btn" id="submit">Create account</button>
      <div class="switch">
        <span id="switch-text">Already have an account?</span>
        <button class="toggle-link" id="switch-mode">Log in</button>
      </div>
    </div>

    <!-- Step 2: all set -->
    <div id="done" class="hidden">
      <h1>You're all set — one quick step</h1>
      <p class="lead">
        Head to your <b>Settings</b> page to choose the sites to block, your reading
        interests, and a theme. You're already signed in there with this account.
      </p>
      <button class="btn" id="go-settings">Go to Settings</button>
    </div>
  </div>
  <script type="module" src="welcome.js"></script>
</body>
</html>
